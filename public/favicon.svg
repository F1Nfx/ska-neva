<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Фон: круг с градиентом -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#1B3A6B"/>
    </linearGradient>
  </defs>

  <!-- Круг -->
  <circle cx="32" cy="32" r="30" fill="url(#grad)" stroke="#C9CED6" stroke-width="2"/>

  <!-- Буквы СКА -->
  <text
    x="32" y="42"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="20"
    font-weight="900"
    fill="#F4F6F8"
    letter-spacing="0.5"
  >
    СКА
  </text>
</svg>